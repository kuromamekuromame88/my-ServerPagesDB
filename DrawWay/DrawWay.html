<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="icon" href="/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/icon320x320.ico" type="image/x-icon">
    <title>DrawWay</title>
    <style>
      html, body{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      div{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #game{
        position: absolute;
        left: 0;
        top: 0;
        z-index: 0;
      }

      #UI{
        /*display: none;*/
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100vw;
        height: 200px;
        z-index: 10;
      }

      #UI button{
        font-weight: bold;
        color: #fff;
        background-color: #000;
        border: none;
        border-radius: 10px;
        padding: 10px;
        max-height: 5vh;
      }

      button{
        touch-action: manipulation;
      }


    </style>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  </head>
  <body>
    <div id="game">
    </div>
    <div class="ui" id="UI">
      <div class="left">
        <button id="left">←</button>
        <button id="right">→</button>
      </div>
      <div class="right">
        <button id="jump">ジャンプ</button>
        <button id="makeobject">物体を描画</button>
      </div>
    </div>
    <script src="/DrawWay/js/main.js"></script>
  </body>
</html>
