<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="icon" href="/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/icon320x320.ico" type="image/x-icon">
    <title>DrawWay</title>
    <style>
      html, body{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      div{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #game{
        position: absolute;
        left: 0;
        top: 0;
        z-index: 0;
      }

      #UI{
        display: none;
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100vw;
        height: 200px;

        flex-direction: row;
        justify-content: space-between; /* 左右に分離 */
        align-items: flex-end; /* 下に寄せる */

        padding: 20px;
        box-sizing: border-box;

        pointer-events: none;
      }

      #UI .left,
      #UI .right{
        display: flex;
        gap: 10px;
        pointer-events: auto;
        max-width: 40vw;
      }

      #UI .right{
        flex-direction: column;
        align-items: flex-end;
      }

      #UI button{
        user-select: none;
        font-weight: bold;
        color: #fff;
        background: rgba(0,0,0,0.6);
        border: 2px solid #fff;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        font-size: 20px;

        backdrop-filter: blur(5px);

        transition: transform 0.1s, background 0.1s;
      }

      /* 押したとき */
      #UI button:active{
        transform: scale(0.9);
        background: rgba(255,255,255,0.3);
      }

      #jump{
        width: 80px;
        height: 80px;
      }

      #makeobject{
        width: 60px;
        height: 60px;
      }

      #Buttons{
        text-align: center;
        position: absolute;
        left: 0px;
        bottom: 100px;
        width: 100vw;
      }

      #startBtn{
        position: absolute;
        left: 50%;
        top: 80%;
        transform: translate(-50%, -50%);
  
        padding: 20px 40px;
        font-size: 24px;

        z-index: 100;
        border-radius: 5px;

        border: 3px solid black;
        background: white;
        cursor: pointer;
      }


      button{
        touch-action: manipulation;
      }


    </style>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  </head>
  <body>
    <div id="game">
    </div>
    <div id="Buttons">
      <button id="startBtn">Click To Start</button>
    </div>
    <div class="ui" id="UI">
      <div class="left">
        <button id="left"><span>←</span></button>
        <button id="right"><span>→</span></button>
      </div>
      <div class="right">
        <button id="jump"><span>↑</span></button>
        <button id="makeobject"><span>道を描く</span></button>
      </div>
    </div>
    <script src="/DrawWay/js/main.js"></script>
  </body>
</html>
