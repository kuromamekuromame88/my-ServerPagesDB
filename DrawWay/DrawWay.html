<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="icon" href="/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/icon320x320.ico" type="image/x-icon">
    <title>DrawWay</title>
    <style>
      html, body{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      div{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #game{
        position: absolute;
        left: 0;
        top: 0;
        z-index: 0;
      }

      #UI{
        display: none;
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100vw;
        height: 200px;
        z-index: 10;
        pointer-events: none;
      }

      /* スマホ用 */
      @media (max-width: 768px) {
        #UI{
          display: block !important;
        }
      }

      /* 左側（移動） */
      #UI .left{
        position: absolute;
        left: 20px;
        bottom: 20px;
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }

      /* 右側（アクション） */
      #UI .right{
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
      }

      #UI button{
        font-weight: bold;
        color: #fff;
        background: rgba(0,0,0,0.6);
        border: 2px solid #fff;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        font-size: 20px;

        backdrop-filter: blur(5px);

        transition: transform 0.1s, background 0.1s;
      }

      /* 押したとき */
      #UI button:active{
        transform: scale(0.9);
        background: rgba(255,255,255,0.3);
      }

      #jump{
        width: 80px;
        height: 80px;
      }

      #makeobject{
        width: 60px;
        height: 60px;
      }

      button{
        touch-action: manipulation;
      }


    </style>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  </head>
  <body>
    <div id="game">
    </div>
    <div class="ui" id="UI">
      <div class="left">
        <button id="left">←</button>
        <button id="right">→</button>
      </div>
      <div class="right">
        <button id="jump">ジャンプ</button>
        <button id="makeobject">物体を描画</button>
      </div>
    </div>
    <script src="/DrawWay/js/main.js"></script>
  </body>
</html>
