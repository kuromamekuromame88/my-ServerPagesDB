<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="https://tool-webs.onrender.com/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="https://tool-webs.onrender.com/icon/icon320x320.ico" type="image/x-icon">
    <title>DrawWay</title>
    <style>
      html, body{
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      div{
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #game{
        position: absolute;
        left: 0;
        top: 0;
      }

      .changeDev{
        position: absolute;
        top: 20px;
        right: 20px;
        max-height: 30px; 
        max-width: max-content;
        z-index: 1000000000;
        background-color: #000;
        border-radius: 10px;
      }

      .devicetype.mobile {
        opacity: 0;
        transform: scale(0.9);
      }

      .devicetype.pc {
        opacity: 1;
        transform: scale(1);
      }

      #ChangeDevice:checked + .devicetype.mobile{
        opacity: 1;
        transform: scale(1);
      }

      #ChangeDevice:checked + .devicetype.pc{
        opacity: 0;
        transform: scale(0.9);
      }

      .devicetype{
        font-weight: bold;
        color: #fff;
        position: absolute;
        top: 5px;
      }

      .statetext{
        text-align: center;
        max-width: max-content;
        max-height: max-content;

      }

      #UI{
        display:none;
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100vW;
        height: 200px;
      }

      #UI button{
        font-weight: bold;
        color: #fff;
        background-color: #000;
        border: none;
        border-radius: 10px;
        padding: 10px;
        max-height: 5vh;
      }


    </style>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  </head>
  <body>
    <div id="game">
      <div class="changeDev">
        <input type="checkbox" id="ChangeDevice">
        <div class="statetext">
          <span class="devicetype mobile">モバイル</span>
          <span class="devicetype pc">PC</span>
        </div>
      </div>
    </div>
    <div class="ui" id="UI">
      <div class="left">
        <button id="left">←</button>
        <button id="right">→</button>
      </div>
      <div class="right">
        <button id="jump">ジャンプ</button>
        <button id="makeobject">物体を描画</button>
      </div>
    </div>
    <script src="https://tool-webs.onrender.com/DrawWay/js/main.js"></script>
  </body>
</html>
