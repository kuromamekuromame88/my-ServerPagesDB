<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="icon/icon16x16.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="icon/icon320x320.ico" type="image/x-icon">
  <title>重要語句クイズ</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    section {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    button.small {
      font-size: 0.85em;
      margin-right: 4px;
    }

    button:hover {
      opacity: 0.85;
    }

    .quiz-box {
      font-size: 1.1em;
      margin: 10px 0;
    }

    .result {
      margin-top: 8px;
      font-weight: bold;
    }

    .item {
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
    }
  </style>
</head>
<body>

<h1>重要語句クイズ</h1>

<section>
  <h2>① 語句を登録・編集</h2>

  <input type="hidden" id="editIndex" value="-1">

  <label>
    重要語句
    <input id="wordInput" type="text">
  </label>

  <label>
    意味
    <textarea id="meaningInput" rows="3"></textarea>
  </label>

  <button onclick="saveItem()">保存</button>
  <button onclick="resetForm()">新規入力</button>
</section>

<section>
  <h2>② 問題一覧（編集・削除）</h2>
  <div id="itemList"></div>
</section>

<section>
  <h2>③ クイズ</h2>

  <div class="quiz-box" id="quizMeaning">
    「次の問題」ボタンを押してください
  </div>

  <input id="answerInput" type="text" placeholder="語句を入力">

  <button onclick="checkAnswer()">答える</button>
  <br>
  <button onclick="nextQuiz()">次の問題</button>

  <div class="result" id="result"></div>
</section>

<section>
  <h2>④ ファイル操作</h2>

  <label>
    <input type="file" accept=".json" onchange="loadFromFile(event)" style="display:none">
    <button onclick="document.querySelector('input[type=file]').click()">ファイルを選択</button>
    <label id="nowFileName">ファイルを選択してください</label>
  </label>
  <br>

  <button onclick="saveToFile()">問題をjsonでダウンロード</button>
</section>

<section>
  <h2>⑤ クラウドに保存済みの問題</h2>

  <button onclick="renderQuizList()">リストをアップデート</button>
  <br>
  <span>ファイルリストから選択</span>
  <select name="quizes" id="quiz-select">
    <option value="">--1 つ選択してください--</option>
    <!-- 以下の項目をJSで動的に作成する -->
    <option value="memo">あとでサーバーにアップロードできるようにする</option>
  </select>
  <button onclick="loadSelectedCloudFile()">読み込む</button>
  <!-- ここのボタンの関数も後で作ること -->
  <button onclick="uploadFileToCloud()">現在のクイズをサーバーにアップロード</button>
</section>

<script>
  let items = [];
  let currentIndex = -1;

  const SERVER_DOMAIN = "tool-webs.onrender.com";

  function saveItem() {
    const word = wordInput.value.trim();
    const meaning = meaningInput.value.trim();
    const index = Number(editIndex.value);

    if (!word || !meaning) {
      alert("語句と意味を入力してください");
      return;
    }

    if (index === -1) {
      items.push({ word, meaning });
    } else {
      items[index] = { word, meaning };
    }

    resetForm();
    renderList();
  }

  function resetForm() {
    wordInput.value = "";
    meaningInput.value = "";
    editIndex.value = -1;
  }

  function renderList() {
    itemList.innerHTML = "";

    items.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <strong>${item.word}</strong>：${item.meaning}<br>
        <button class="small" onclick="editItem(${i})">編集</button>
        <button class="small" onclick="deleteItem(${i})">削除</button>
      `;

      itemList.appendChild(div);
    });
  }

  function editItem(index) {
    wordInput.value = items[index].word;
    meaningInput.value = items[index].meaning;
    editIndex.value = index;
  }

  function deleteItem(index) {
    if (!confirm("削除しますか？")) return;
    items.splice(index, 1);
    renderList();
  }

  function nextQuiz() {
    if (items.length === 0) {
      alert("問題がありません");
      return;
    }

    currentIndex = Math.floor(Math.random() * items.length);
    quizMeaning.textContent = "意味： " + items[currentIndex].meaning;
    answerInput.value = "";
    result.textContent = "";
  }

  function checkAnswer() {
    if (currentIndex === -1) return;

    const answer = answerInput.value.trim();
    const correct = items[currentIndex].word;

    if (answer === correct) {
      result.textContent = "正解！";
      result.style.color = "green";
    } else {
      result.textContent = "不正解… 正解は「" + correct + "」";
      result.style.color = "red";
    }
  }

  document.addEventListener("keydown", (e)=>{
    if (e.key === "Enter") {
      if (document.activeElement === answerInput) {
        setTimeout(()=>{
          if(document.getElementById("result").textContent.startsWith("正解")) {
            nextQuiz();
          }
        }, 100);
        setTimeout(()=>{}, 1000);
        checkAnswer();
      } else {
        if(e.shiftKey) return;
        e.preventDefault();
        saveItem();
        document.getElementById("wordInput").focus();
      }
    }
  });

  function saveToFile() {
    const blob = new Blob(
      [JSON.stringify(items, null, 2)],
      { type: "application/json" }
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "quiz-data.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function loadFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        //ファイル名をlabelに表示
        document.getElementById("nowFileName").textContent = file.name;

        items = JSON.parse(reader.result);
        renderList();
        resetForm();
        alert("読み込み完了");
      } catch {
        alert("ファイル形式が正しくありません");
      }
    };
    reader.readAsText(file);
  }

  async function uploadFileToCloud() {
    //現在の問題のjsonをサーバーのAPIに投げる
    const quizname = prompt("クイズ名を入力してください", "quiz-data");

    const r = await fetch(`https://${SERVER_DOMAIN}/wordquiz/upload`, {
      method: "POST",
      type: "appcation/json",
      body: JSON.stringify({
        quizname: quizname,
        quizdata: items,
      })
    });
    console.log(r);
    const res = await r.json();

    alert(res.ok?"アップロード成功しました":"アップロードに失敗しました");
  }

  //クイズリスト取得関数
  async function loadCloudFilesList() {
    const res = await fetch(`https://${SERVER_DOMAIN}/wordquiz/quizesname`, {
      method: "GET",
    });
    const data = await res.json();
    return data;
  }

  async function renderQuizList(){
    const a = await loadCloudFilesList();
    const list = a["quizes"];
    let dom = "";
    var c;
    while(c<list.length){
      dom+=`<option value="${list[c]}">${list[c]}</option>`;
      c++;
    }
    console.log(dom);
    document.getElementById("quiz-select").innerHTML = dom;
  }

  async function loadSelectedCloudFile() {
    //APIをたたいてjson取得
    quizName = document.getElementById("pet-select").value;

    //指定されたクイズ名が存在するかのチェック
    const quizList = await loadCloudFilesList();
    if(!quizList.includes(quizName)) {
      alert("そのクイズは存在しませんでした。");
      return;
    }
    const res = await fetch(`https://${SERVER_DOMAIN}/wordquiz/quizes?quiz=${quizName}`, {
      method: "GET",
    });
    const data = await res.json();
  }
</script>

</body>
</html>
