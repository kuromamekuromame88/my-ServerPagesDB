<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Xcode用pbxproj生成ツール</title>
<style>
  body {
    font-family: 'Courier New', monospace;
    padding: 20px;
    background-color: #f9f9f9;
  }

  textarea {
    width: 100%;
    height: 180px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
  }

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 10px;
  }

  button:hover {
    background-color: #45a049;
  }

  #tree {
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 5px;
    border: 1px solid #ddd;
  }

  .node { margin-left: 20px; }
  .folder { font-weight: bold; }
  .file { color: #333; }
</style>
</head>
<body>

<h2>JSONでフォルダ構造を定義</h2>
<textarea id="jsonInput"></textarea>

<button onclick="generateTree()">ツリー生成</button>
<button onclick="pickProjectRoot()">プロジェクトルートを選択</button>
<button onclick="generatePBXProj()">pbxproj生成</button>

<h2>フォルダツリー</h2>
<div id="tree"></div>

<h2>生成されたpbxproj</h2>
<textarea id="output"></textarea>

<script>

let rootModel = null;

/* ------------------ UUID管理 ------------------ */

const uuidSet = new Set();

function generateTypedPBXUUID(suffix) {
  let uuid;
  do {
    const bytes = new Uint8Array(12);
    crypto.getRandomValues(bytes);
    const base = Array.from(bytes)
      .map(b => b.toString(16).padStart(2, "0"))
      .join("")
      .toUpperCase()
      .substring(0, 23);
    uuid = base + suffix;
  } while (uuidSet.has(uuid));

  uuidSet.add(uuid);
  return uuid;
}

/* ------------------ 拡張子判定 ------------------ */

function detectFileType(name) {
  if (name.endsWith(".swift")) return "sourcecode.swift";
  if (name.endsWith(".m")) return "sourcecode.c.objc";
  if (name.endsWith(".h")) return "sourcecode.c.h";
  if (name.endsWith(".plist")) return "text.plist.xml";
  return "text";
}

/* ------------------ JSON → 内部モデル変換 ------------------ */

function convertToModel(name, value) {
  if (value && typeof value === "object") {
    return {
      name,
      type: "folder",
      uuid: generateTypedPBXUUID("G"),
      children: Object.entries(value).map(([k, v]) =>
        convertToModel(k, v)
      )
    };
  } else {
    return {
      name,
      type: "file",
      fileRefUUID: generateTypedPBXUUID("A"),
      buildFileUUID: generateTypedPBXUUID("B"),
      build: false,
      fileType: detectFileType(name)
    };
  }
}

/* ------------------ ツリー生成 ------------------ */

function generateTree() {
  const jsonStr = document.getElementById("jsonInput").value;
  const treeArea = document.getElementById("tree");
  treeArea.innerHTML = "";
  uuidSet.clear();

  try {
    const data = JSON.parse(jsonStr);
    const rootKey = Object.keys(data)[0];
    rootModel = convertToModel(rootKey, data[rootKey]);
    renderNode(rootModel, treeArea);
  } catch (e) {
    treeArea.textContent = "JSON解析エラー:\n" + e;
  }
}

/* ------------------ HTMLツリー描画 ------------------ */

function renderNode(node, container) {
  const div = document.createElement("div");
  div.classList.add("node");

  if (node.type === "folder") {
    div.classList.add("folder");
    div.textContent = "📁 " + node.name + "  [" + node.uuid + "]";
    container.appendChild(div);
    node.children.forEach(child => renderNode(child, container));
  } else {
    div.classList.add("file");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.style.marginRight = "5px";

    checkbox.onchange = () => {
      // SwiftのみBuild可
      if (node.fileType === "sourcecode.swift") {
        node.build = checkbox.checked;
      } else {
        checkbox.checked = false;
        alert("SwiftファイルのみBuild対象にできます");
      }
    };

    div.appendChild(checkbox);
    div.append(
      "📄 " + node.name +
      "  [Ref:" + node.fileRefUUID +
      " | Build:" + node.buildFileUUID + "]"
    );
    container.appendChild(div);
  }
}

/* ------------------ ファイル収集 ------------------ */

function collectFiles(node, list = []) {
  if (node.type === "file") {
    list.push(node);
  } else {
    node.children.forEach(c => collectFiles(c, list));
  }
  return list;
}

/* ------------------ PBXBuildFile生成 ------------------ */

function generateBuildFileSection(files) {

  let section = "/* Begin PBXBuildFile section */\n";

  files
    .filter(f => f.build && f.fileType === "sourcecode.swift")
    .forEach(file => {

      section +=
`	${file.buildFileUUID} /* ${file.name} in Sources */ = {
		isa = PBXBuildFile;
		fileRef = ${file.fileRefUUID} /* ${file.name} */;
	};
`;
    });

  section += "/* End PBXBuildFile section */\n";
  return section;
}

/* ------------------ PBXFileReference生成 ------------------ */

function generateFileRefSection(files) {

  let section = "/* Begin PBXFileReference section */\n";

  files.forEach(file => {
    section +=
`	${file.fileRefUUID} /* ${file.name} */ = {
		isa = PBXFileReference;
		lastKnownFileType = ${file.fileType};
		path = "${file.name}";
		sourceTree = "<group>";
	};
`;
  });

  section += "/* End PBXFileReference section */\n";
  return section;
}

/* ------------------ PBXGroup生成 ------------------ */

function generateGroupSection(root) {

  let section = "/* Begin PBXGroup section */\n";

  function walk(node) {

    if (node.type !== "folder") return;

    const childrenUUIDs = node.children.map(child =>
      child.type === "folder" ? child.uuid : child.fileRefUUID
    );

    section +=
`	${node.uuid} /* ${node.name} */ = {
		isa = PBXGroup;
		children = (
${childrenUUIDs.map(id => `			${id},`).join("\n")}
		);
		path = "${node.name}";
		sourceTree = "<group>";
	};
`;

    node.children.forEach(walk);
  }

  walk(root);
  section += "/* End PBXGroup section */\n";
  return section;
}

/* ------------------ pbxproj生成 ------------------ */

function generatePBXProj() {

  if (!rootModel) return;

  const files = collectFiles(rootModel);

  const buildSection = generateBuildFileSection(files);
  const fileRefSection = generateFileRefSection(files);
  const groupSection = generateGroupSection(rootModel);

  const projectUUID = generateTypedPBXUUID("P");

  const result =
`// !$*UTF8*$!
{
	archiveVersion = 1;
	classes = {};
	objectVersion = 56;
	objects = {

${buildSection}
${fileRefSection}
${groupSection}

	};

	rootObject = ${projectUUID} /* Project object */;
}
`;

  document.getElementById("output").value = result;
}

</script>
</body>
</html>
