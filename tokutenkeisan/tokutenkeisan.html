<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>得点計算ツール</title>

  <style>
    body {
      margin: 0;
      padding-top: 70px;
      font-family: system-ui, sans-serif;
      background: #f2f4f7;
    }

    /* ===== トップバー ===== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background-color: #333;
      color: white;
      display: flex;
      align-items: center;
      padding-left: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .top-bar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* ===== メインカード ===== */
    .maincontent {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    h4 {
      margin: 0 0 10px;
      font-weight: normal;
      color: #555;
      font-size: 14px;
    }

    /* ===== 入力行 ===== */
    .score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day {
      font-size: 18px;
      white-space: nowrap;
    }

    input[type=number] {
      width: 120px;
      height: 42px;
      font-size: 24px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* ===== ボタン ===== */
    button {
      margin-top: 10px;
      height: 45px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #000000;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #404040;
    }

    /* ===== 結果 ===== */
    #result {
      margin-top: 10px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <a href="/">tool-html</a>
  </div>

  <div class="maincontent">
    <h1>得点計算ツール</h1>
    <h4>平均の算出などの面倒な作業を効率よく計算するために作ったサイトです。</h4>

    <div class="score">
      <span class="day">1日目</span>
      <input type="number" max="60" min="0" id="ia" value="60">
    </div>

    <div class="score">
      <span class="day">2日目</span>
      <input type="number" max="60" min="0" id="ib" value="60">
    </div>

    <div class="score">
      <span class="day">3日目</span>
      <input type="number" max="60" min="0" id="ic" value="50">
    </div>

    <div class="score">
      <span class="day">4日目</span>
      <input type="number" max="60" min="0" id="id" value="60">
    </div>

    <div class="score">
      <span class="day">5日目</span>
      <input type="number" max="60" min="0" id="ie" value="60">
    </div>

    <div class="score">
      <span class="day">授業数</span>
      <input type="number" max="30" min="0" value="29" id="z">
    </div>

    <button onclick="b()">集計</button>
    <p id="result"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
  <script>
    function orgFloor(value, base) {
      return Math.floor(value * base) / base;
    }

    function p(str, color) {
      const text = document.getElementById("result");
      text.style.color = color;
      text.innerText = str;
    }

    function b() {
      const a = parseInt(ia.value);
      const b = parseInt(ib.value);
      const c = parseInt(ic.value);
      const d = parseInt(id.value);
      const e = parseInt(ie.value);
      const z = parseInt(document.getElementById("z").value);

      const sum = a + b + c + d + e;
      const res = orgFloor(sum / z, 100);

      if (isNaN(z)) {
        p("授業数の値を設定してください", "red");
      } else if (z >= 31) {
        p("授業数の値は30以下である必要があります。", "red");
      } else if (isNaN(sum)) {
        p("少なくとも1日分の得点を記載する必要があります。", "red");
      } else {
        p(`合計: ${sum}　平均: ${res}`, "blue");
      }
    }
  </script>
</body>
</html>
