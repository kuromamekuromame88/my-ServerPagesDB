<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <!--<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">-->
    <link rel="icon" href="/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/icon320x320.ico" type="image/x-icon">
    <title>新規登録 - WebChat</title>
    <!-- ログインページのcss -->
    <link rel="stylesheet" href="/chat/register/style/register.css">
  </head>
  <body>
    <main>
      <div class="LoginModal">
        <div class="LoginTitle">
          アカウントを作成
        </div>
        <div class="LoginMessage"></div>
        <div class="LoginUserInfo">
          <input type="text" id="userN" placeholder="ユーザー名">
          <input type="password" id="pass" placeholder="パスワード">
        </div>
        <div class="SubmitButtons">
          <button class="MakeAccount">作成</button>
          <a href="/chat/login"><button class="MakeAccount">既存のアカウントでログイン</button></a>
        </div>
      </div>

      <div class="AnUserIDShadow">
        <div class="AnUserID">
          <!-- 登録後のユーザーIDの通知ダイアログ -->
          <div class="AnUserIDTitle">
            重要: ユーザーIDについて
          </div>
          <div class="AnUserIDInfo">
            WebChatでは、ユーザーの管理に、サーバーが生成したIDを一人ずつ割り当てています。
            あなたのユーザーIDは、<span class="YourID"></span>です。ログインの際に必要になりますので、メモなどをしておいて覚えてください。
          </div>
          <div class="AnUserIDContinue">
            <button class="ContinueBtn">続ける</button>
          </div>
        </div>
      </div>

    </main>
    <script src="/chat/register/js/register.js"></script>
  </body>
</html>
