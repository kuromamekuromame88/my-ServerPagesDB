<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="https://tool-webs.onrender.com/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="https://tool-webs.onrender.com/icon/icon320x320.ico" type="image/x-icon">
    <title>webchatにログイン</title>
    <!-- ログインページのcss -->
    <link rel="stylesheet" href="style/login.css">
  </head>
  <body>
    <main>
      <div class="LoginModal">
        <div class="LoginTitle">
          webchatにログイン
        </div>
        <div class="LoginUserInfo">
          <span>ユーザーID:<input type="text"></span>
          <span>パスワード:<input type="password"></span>
        </div>
        <div class="SubmitButtons">
          <button class="Login">ログイン</button>
          <!-- <button class="ForgotPass">パスワードを忘れました</button> -->
          <button class="MakeAccount">新しいアカウントを作成</button>
        </div>
      </div>
    </main>
  </body>
</html>
