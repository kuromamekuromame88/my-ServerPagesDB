<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <!--<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">-->
    <link rel="icon" href="/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/icon320x320.ico" type="image/x-icon">
    <title>ログインページ - WebChat</title>
    <!-- ログインページのcss -->
    <link rel="stylesheet" href="/chat/login/style/login.css">
  </head>
  <body>
    <main>
      <div class="LoginModal">
        <div class="LoginTitle">
          webchatにログイン
        </div>
        <div class="LoginMessage"></div>
        <div class="LoginUserInfo">
          <input type="text" id="user" placeholder="ユーザーID">
          <input type="password" id="pass" placeholder="パスワード">
          <span>ログイン状態を維持<input type="checkbox" id="keeplogin"></span>
        </div>
        <div class="SubmitButtons">
          <button class="Login">ログイン</button>
          <a href="/chat/login"><button class="MakeAccount">新しいアカウントを作成</button></a>
        </div>
      </div>
    </main>
    <script src="/chat/login/js/login.js"></script>
  </body>
</html>
