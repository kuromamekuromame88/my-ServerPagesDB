<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="https://tool-webs.onrender.com/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="https://tool-webs.onrender.com/icon/icon320x320.ico" type="image/x-icon">
    <title>あゆみ管理ページ</title>

    <link rel="stylesheet" href="ayumiManager/style/main.css">
    <link rel="stylesheet" href="ayumiManager/style/calender.css">
    <link rel="stylesheet" href="ayumiManager/style/schedule.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
    
    <style>
    </style>

  </head>
  <body>
    <header class="top-bar">
      <a href="/" class="logo">tool-webs</a>
    </header>
    <main>
      <div class="cal">
        <div class="wrapper">
          <!-- xxxx年xx月を表示 -->
          <h1 id="header"></h1>
          <!-- ボタンクリックで月移動 -->
          <div id="next-prev-button">
            <button id="prev" onclick="prev()"><</button>
            <button id="next" onclick="next()">></button>
          </div>
          <!-- カレンダー -->
          <div id="calendar"></div>
        </div>
      </div>

      <div class="schedule">
        <div class="scheduleTable">
          <div class="nav-tools">
            <div class="nav">
              編集モード:<input type="checkbox" class="slide" id="slide">
            </div>
          </div>
          <table>
            <tbody id="sbody">
              <tr>
                <td>左のカレンダーから目的の日を選択してください。</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="m-plus-rounded-1c-regular wavetext" id="loading">
          <span>読</span>
          <span>み</span>
          <span>込</span>
          <span>み</span>
          <span>中</span>
          <span>.</span>
          <span>.</span>
          <span>.</span>
        </div>
      </div>
    </main>

    <script src="ayumiManager/js/main.js"></script>
    <script src="ayumiManager/js/calender.js"></script>
    
  </body>
</html>
