<html>
  <head>
    <meta charset="utf-8">
    <title>voice</title>
    <link rel="icon" href="https://tool-webs.onrender.com/icon/icon16x16.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="https://tool-webs.onrender.com/icon/icon320x320.ico" type="image/x-icon">

    <!--<link rel="stylesheet" href="./style/button.css">-->
    <!-- 画面下部のtoolbarのcss -->
    <link rel="stylesheet" href="https://tool-webs.onrender.com/voice/style/toolbar.css">
    <link rel="stylesheet" href="https://tool-webs.onrender.com/voice/style/peopleList.css">
    <link rel="stylesheet" href="https://tool-webs.onrender.com/voice/style/callingTab.css">

    <style>
      html, body {
        width: 100%;
        margin: 0;
      }

      body{
        background-color: #fff;
        padding-top: 50px;
        display: flex;
        overflow: hidden;
      }

      /* =========================
      トップバー
      ========================= */
      .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        background-color: #333;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-around;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        z-index: 1000;
      }

      .top-bar a {
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 5px;
        transition: background-color 0.3s;
      }

      .top-bar a:hover {
        background-color: #555;
      }
      
      .logo {
        position: absolute;
        left: 0;
      }


      .rightside{
        height: 100%;
        flex: 7;
        flex-direction: column;
        display: flex;
      }

    </style>
  </head>
  <body>
    

    <div class="top-bar">
      <a href="/" class="logo"><b>tool-webs</b></a>
      <b id="callStatus" style="color:#fff;"></b>
    </div>

    <div id="userStatusBar" class="user-status-bar">
      <h3>ユーザー</h3>
      <div id="userList"></div>
      <h3>グループ(仮)</h3>
      <div id="groupList"></div>
      <button id="makegroup">新しいグループを作成</button>
    </div>


    <div class="rightside">
      <div class="callingTab" id="remoteVideos">
        <div class="remote">
          <audio id="remoteAudio" autoplay style="display:none;"></audio>
          <video id="remoteVideo" autoplay playsinline muted></video>
        </div>
        <div class="myvideo">
          <video id="localVideo" autoplay muted playsinline muted></video>
        </div>
      </div>


      <div class="toolbar">
        <label class="micchengebox">
          <input type="checkbox" class="mic">
          <span class="micButton">
          <!-- マイクSVG -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="micIcon micon">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
              <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/>
            </svg>
          
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="micIcon micoff">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
              <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/>
              <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
        </label>

        <label class="camchengebox">
          <input type="checkbox" class="cam">
          <span class="camButton">
          <!-- マイクSVG -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="camIcon camon">
              <rect x="2" y="6" width="13" height="12" rx="2.5"/>
              <path d="M16.5 9 L21 6.5 C21.8 6.1 22.5 6.6 22.5 7.5 V16.5 C22.5 17.4 21.8 17.9 21 17.5 L16.5 15 Z"/>
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="camIcon camoff">
              <rect x="2" y="6" width="13" height="12" rx="2.5"/>
              <path d="M16.5 9 L21 6.5 C21.8 6.1 22.5 6.6 22.5 7.5 V16.5 C22.5 17.4 21.8 17.9 21 17.5 L16.5 15 Z"/>
              <path d="M4 20 L20 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            </svg>

          </span>
        </label>

        <button class="callEnd">
          <svg class="callEndIcon" viewBox="0 0 24 24" aria-hidden="true">
            <g transform="scale(0.04)">
              <g transform="translate(300 315) scale(25)">
                <path d="
                  M9.335,-1.818
                  C4.185,-6.967 -4.164,-6.967 -9.313,-1.818
                  C-11.691,0.561 -11.351,3.604 -9.556,5.399
                  C-9.301,5.654 -8.909,5.713 -8.59,5.544
                  L-4.27,3.257
                  C-3.871,3.046 -3.683,2.577 -3.826,2.149
                  L-4.558,-0.046
                  C-1.825,-1.998 1.846,-1.998 4.579,-0.046
                  L3.815,2.758
                  C3.693,3.207 3.924,3.677 4.354,3.854
                  L8.636,5.617
                  C8.946,5.745 9.303,5.673 9.54,5.436
                  C11.332,3.644 11.709,0.556 9.335,-1.818
                  Z
                "/>
              </g>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <!--ロールバック用JS <script src="https://tool-webs.onrender.com/voice/js/main.js"></script>-->
    <script src="https://tool-webs.onrender.com/voice/js/voice.js"></script>
  </body>
</html>
