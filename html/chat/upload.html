<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ファイルアップロードテスト</title>
</head>
<body>
  <h2>ファイルをアップロード</h2>
  <form id="uploadForm">
    <input type="file" name="file" id="fileInput" required>
    <button type="submit">アップロード</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("uploadForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files.length) {
        status.textContent = "ファイルを選択してください";
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      status.textContent = "アップロード中…";

      try {
        const res = await fetch("https://tool-webs.onrender.com/webchat/upload", {
          method: "POST",
          body: formData
        });

        const result = await res.json();
        if (res.ok) {
          status.textContent = `アップロード成功: ${result.filename}`;
        } else {
          status.textContent = `アップロード失敗: ${result.error}`;
        }
      } catch (err) {
        status.textContent = "アップロード中にエラーが発生しました";
        console.error(err);
      }
    });
  </script>
</body>
</html>
