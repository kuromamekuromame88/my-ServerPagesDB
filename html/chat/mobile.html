<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://tool-webs.onrender.com/icon/icon16x16.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="https://tool-webs.onrender.com/icon/icon320x320.ico" type="image/x-icon">
  <title>WebChat</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.0/pixi.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

  <link rel="stylesheet" href="https://tool-webs.onrender.com/chat/style/main.css">
  
  <link rel="stylesheet" href="https://tool-webs.onrender.com/chat/style/chat.css">
  
  <style>

    /* ----------------- ボード ----------------- */
    #boardUI {
      display: none;
      width: 100%;
      height: calc(100vh - 60px);
      background: #ddd;
      overflow: hidden;
    }

    /* 🌟 【修正6】ニックネーム初回登録UIをデフォルトで非表示 🌟 */
    #usernameSetup {
      display: none;
    }

    /* ----------------- 🌟 モバイル向けスタイル追加 🌟 ----------------- */
    @media (max-width: 768px) {
      /* top-bar: ボタンを縦に積み重ねるか、アイコン化する */
      .top-bar {
        height: auto; /* 高さを自動調整 */
        flex-direction: column; /* 縦並びにする */
        padding: 8px;
        align-items: flex-start;
      }

      .top-bar .logo {
        margin-bottom: 8px;
      }

      .top-bar .nav-buttons {
        display: flex;
        flex-wrap: wrap; /* ボタンが多すぎる場合、折り返す */
        gap: 4px; /* ボタン間のスペースを小さく */
        width: 100%;
      }
      
      .top-bar .nav-buttons button,
      .top-bar .nav-buttons .roomselect button {
        /* タッチしやすいようにボタンのパディングを大きく */
        padding: 8px 12px;
        font-size: 14px;
        flex-grow: 1; /* スペースに合わせてボタンを広げる */
        min-width: 80px; /* 最小幅を確保 */
      }
      
      /* ルーム選択メニュー */
      .roomselect {
        flex-grow: 1;
      }
      .room-menu {
        width: 250px; /* メニューの幅を固定 */
      }
      .room-create input {
        width: calc(100% - 60px);
      }
      
      /* userStatusBar: モバイルでは右側から引き出す形式を想定し、初期は非表示 */
      #userStatusBar {
        position: fixed;
        top: 0;
        right: 0;
        width: 250px; /* 幅を固定 */
        height: 100vh;
        transform: translateX(100%); /* 画面外に隠す */
        transition: transform 0.3s ease-in-out;
        z-index: 1000;
        background: #fff; /* 背景色を設定して見やすく */
        box-shadow: -2px 0 5px rgba(0,0,0,0.2);
        padding: 10px;
      }
      
      #userStatusBar.open {
        transform: translateX(0); /* 表示 */
      }

      /* chatUI: ユーザーリスト非表示に合わせて幅を調整 */
      #chatUI {
        width: 100%;
        left: 0;
      }

      body{
        padding-top: 140px;
        overflow: hidden;
      }
      
      /* chat-container: top-barの高さが可変なので、vhからtop-barの最大高さを引く */
      .chat-container {
        height: calc(100vh - 150px) !important; /* input-areaとtop-barに合わせて調整 */
      }

      /* input-area: 縦に広がりすぎないように調整 */
      .input-area {
        flex-direction: column;
        padding: 8px;
        gap: 8px;
        border-top: 1px solid #ccc;
      }

      .input-area textarea {
        height: 80px; /* 高さを固定 */
        resize: none; /* ユーザーによるリサイズを禁止 */
      }

      .input-area #sendButton,
      .input-area #img_upload {
        width: 100%; /* 幅をいっぱいに広げる */
        padding: 10px;
        margin: 0;
      }
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <a href="/" class="logo">tool-html</a>

    <div class="nav-buttons">
      <div class="room" id="room"></div>
      <div class="roomselect">
        <button id="roomToggleBtn">ルーム選択 ▾</button>

        <div id="roomMenu" class="room-menu">
          <div class="room-list">
            </div>

          <div class="room-create">
            <input id="new-room-name" type="text" placeholder="新しいルーム名" />
            <button id="create-room-btn">＋ 作成</button>
          </div>
        </div>
      </div>

      <button id="openChat">💬 チャット</button>
      <button id="openBoard">📝 ボード</button>
      <button id="openNicknameChange">✏️ ニックネーム変更</button>
      <button id="toggleUserList" style="display: none;">👤 ユーザー</button>
    </div>
  </div>


  <div id="usernameSetup" class="username-setup">
    <h2>ニックネームを入力してください</h2>
    <p>※他人になりすますなよ</p>
    <input type="text" id="usernameInput" placeholder="ニックネーム">
    <button id="saveUsername">登録</button>
  </div>

  <div id="nicknameChangeModal">
    <div id="nicknameChangeBox" class="nickname-change-box">
      <h3>ニックネーム変更</h3>
      <input type="text" id="newNicknameInput" placeholder="新しいニックネーム">
      <button id="changeNickname">変更</button>
      <button id="cancelNicknameChange" style="background:#999;">キャンセル</button>
    </div>
  </div>

  <div id="chatUI" style="display:none;">
    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
      <button id="img_upload">画像を送信</button>
      <textarea id="messageInput" placeholder="メッセージを入力 (Shift+Enterで改行)"></textarea>
      <button id="sendButton">送信</button>
    </div>
  </div>

  
  <div id="userStatusBar" class="user-status-bar">
    <h3>ユーザー</h3>
    <div id="userList"></div>
  </div>


  <div id="boardUI"></div>

  <script src="https://tool-webs.onrender.com/chat/js/board.js"></script>
  <script>

    /*
    // サンプルカード追加
    createCard(0, 0, 'カードA');
    createCard(50, 50, 'カードB');
    */

    // 🌟 モバイルでのユーザーリスト表示/非表示の切り替えロジックを追加 🌟
    const userStatusBar = document.getElementById('userStatusBar');
    const toggleUserListBtn = document.getElementById('toggleUserList');

    if (window.innerWidth <= 768) {
      // モバイルサイズの場合、ユーザーリストボタンを表示
      toggleUserListBtn.style.display = 'block';

      // ユーザーリストの表示/非表示を切り替える関数
      toggleUserListBtn.addEventListener('click', () => {
        userStatusBar.classList.toggle('open');
      });

      // 画面をタップした際にユーザーリストを閉じる（簡単な実装）
      document.addEventListener('click', (event) => {
        const isClickInsideBar = userStatusBar.contains(event.target);
        const isClickOnToggleBtn = toggleUserListBtn.contains(event.target);
        
        if (userStatusBar.classList.contains('open') && !isClickInsideBar && !isClickOnToggleBtn) {
          userStatusBar.classList.remove('open');
        }
      });
    }

  </script>
  <script src="https://tool-webs.onrender.com/chat/js/chat.js"></script>
</body>
</html>
