<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HTML大乱闘スマッシュ風デモ</title>
<style>
  body { margin: 0; background: #222; overflow: hidden; }
  canvas { display: block; margin: 0 auto; }
</style>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.2.4/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
</head>
<body>
<script>
const { Engine, Runner, Bodies, Body, Composite } = Matter;

// Pixiアプリ
const app = new PIXI.Application({
    width: 800,
    height: 450,
    backgroundColor: 0x222222
});
document.body.appendChild(app.view);

// Matterエンジン
const engine = Engine.create();
const world = engine.world;
const runner = Runner.create();
Runner.run(runner, engine);

// --- ステージ（終点風） ---
const ground = Bodies.rectangle(400, 420, 800, 60, { isStatic: true });
Composite.add(world, ground);

// Pixiステージ描画
const groundSprite = new PIXI.Graphics();
groundSprite.beginFill(0x4444ff);
groundSprite.drawRect(0, 0, 800, 60);
groundSprite.endFill();
groundSprite.y = 390;
app.stage.addChild(groundSprite);

// --- プレイヤー生成関数 ---
function createPlayer(x, color) {
    const body = Bodies.rectangle(x, 300, 40, 60, { friction: 0.001, restitution: 0.2 });
    const sprite = new PIXI.Graphics();
    sprite.beginFill(color);
    sprite.drawRect(-20, -30, 40, 60);
    sprite.endFill();
    app.stage.addChild(sprite);
    return { body, sprite, attacking: false, canAttack: true, dir: 1, spawnX: x, spawnY: 300 };
}

// プレイヤー1,2作成
const player1 = createPlayer(300, 0xff4444);
const player2 = createPlayer(500, 0x44ff44);
Composite.add(world, [player1.body, player2.body]);

// --- 攻撃用 ---
function attack(player, target) {
    if (!player.canAttack) return;
    player.attacking = true;
    player.canAttack = false;

    const attackRange = 60;
    const power = 0.075; // 吹っ飛び率を半減
    const dir = player.dir;

    // 見た目のエフェクト
    const fx = new PIXI.Graphics();
    fx.beginFill(0xffffff);
    fx.drawCircle(0, 0, 15);
    fx.endFill();
    fx.x = player.sprite.x + dir * attackRange;
    fx.y = player.sprite.y;
    app.stage.addChild(fx);

    setTimeout(() => app.stage.removeChild(fx), 100);

    // 当たり判定
    const dx = target.body.position.x - player.body.position.x;
    const dy = target.body.position.y - player.body.position.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < attackRange) {
        Body.applyForce(target.body, target.body.position, {
            x: dir * power,
            y: -power
        });
    }

    // 攻撃クールダウン
    setTimeout(() => { player.attacking = false; }, 200);
    setTimeout(() => { player.canAttack = true; }, 600);
}

// --- キー入力 ---
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// --- ゲームループ ---
app.ticker.add(() => {
    // Player1: A,D,W,Space
    if (keys['KeyA']) { Body.applyForce(player1.body, player1.body.position, { x: -0.002, y: 0 }); player1.dir = -1; }
    if (keys['KeyD']) { Body.applyForce(player1.body, player1.body.position, { x: 0.002, y: 0 }); player1.dir = 1; }
    if (keys['KeyW'] && Math.abs(player1.body.velocity.y) < 0.1) Body.applyForce(player1.body, player1.body.position, { x: 0, y: -0.07 }); // ジャンプ強化
    if (keys['Space']) attack(player1, player2);

    // Player2: ←,→,↑,Enter
    if (keys['ArrowLeft']) { Body.applyForce(player2.body, player2.body.position, { x: -0.002, y: 0 }); player2.dir = -1; }
    if (keys['ArrowRight']) { Body.applyForce(player2.body, player2.body.position, { x: 0.002, y: 0 }); player2.dir = 1; }
    if (keys['ArrowUp'] && Math.abs(player2.body.velocity.y) < 0.1) Body.applyForce(player2.body, player2.body.position, { x: 0, y: -0.07 }); // ジャンプ強化
    if (keys['Enter']) attack(player2, player1);

    // 角度固定（転がらないように）
    [player1, player2].forEach(p => {
        Body.setAngle(p.body, 0);
        Body.setAngularVelocity(p.body, 0);

        // スプライト位置更新
        p.sprite.x = p.body.position.x;
        p.sprite.y = p.body.position.y;

        // --- 復帰処理 ---
        if (p.body.position.y > 600 || p.body.position.x < -100 || p.body.position.x > 900) {
            Body.setPosition(p.body, { x: p.spawnX, y: p.spawnY });
            Body.setVelocity(p.body, { x: 0, y: 0 });
        }
    });
});
</script>
</body>
</html>
