<canvas id="game"></canvas>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js"></script>
<script>
  // === Pixi.js 初期化 ===
  const app = new PIXI.Application({
    view: document.getElementById('game'),
    width: 800,
    height: 600,
    backgroundColor: 0x000010 // 宇宙っぽい背景
  });

  // === 背景の演出 ===
  const stars = new PIXI.Graphics();
  for (let i = 0; i < 100; i++) {
    stars.beginFill(0xffffff, Math.random());
    stars.drawCircle(Math.random() * 800, Math.random() * 600, Math.random() * 2);
    stars.endFill();
  }
  app.stage.addChild(stars);

  // === ステージ（終点） ===
  const stageGraphics = new PIXI.Graphics();
  stageGraphics.beginFill(0x4040ff);
  stageGraphics.drawRoundedRect(150, 500, 500, 40, 10); // 平坦な足場
  stageGraphics.endFill();
  app.stage.addChild(stageGraphics);

  // === プレイヤー（仮：バニー） ===
  const player = PIXI.Sprite.from('https://pixijs.io/examples/examples/assets/bunny.png');
  player.anchor.set(0.5);
  player.scale.set(1.5);
  app.stage.addChild(player);

  // === Matter.js 初期化 ===
  const Engine = Matter.Engine,
        World = Matter.World,
        Bodies = Matter.Bodies;

  const engine = Engine.create();
  engine.gravity.y = 1.2; // 重力やや強め

  // プレイヤーの物理ボディ
  const playerBody = Bodies.circle(400, 300, 20, {
    restitution: 0.4, // 弾性
    friction: 0.1
  });

  // ステージの床
  const ground = Bodies.rectangle(400, 520, 500, 40, {
    isStatic: true,
    friction: 1
  });

  World.add(engine.world, [playerBody, ground]);

  // === 操作（左右・ジャンプ） ===
  const keys = {};
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);

  // === メインループ ===
  app.ticker.add(() => {
    // Matter更新
    Matter.Engine.update(engine, 1000 / 60);

    // 入力処理
    if (keys['ArrowLeft']) Matter.Body.setVelocity(playerBody, { x: -5, y: playerBody.velocity.y });
    if (keys['ArrowRight']) Matter.Body.setVelocity(playerBody, { x: 5, y: playerBody.velocity.y });
    if (keys[' '] && Math.abs(playerBody.velocity.y) < 0.5) {
      Matter.Body.setVelocity(playerBody, { x: playerBody.velocity.x, y: -10 });
    }

    // 座標同期
    player.x = playerBody.position.x;
    player.y = playerBody.position.y;
    player.rotation = playerBody.angle;

    // 画面外に落ちたら復帰
    if (playerBody.position.y > 800) {
      Matter.Body.setPosition(playerBody, { x: 400, y: 100 });
      Matter.Body.setVelocity(playerBody, { x: 0, y: 0 });
    }
  });
</script>
