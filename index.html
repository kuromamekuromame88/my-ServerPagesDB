<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HTML大乱闘スマッシュ風デモ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #222;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.2.4/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
</head>
<body>
<script>
const { Engine, Runner, Bodies, Body, Composite } = Matter;

const WIDTH = window.innerWidth;
const HEIGHT = window.innerHeight;

// Pixiアプリ
const app = new PIXI.Application({
    width: WIDTH,
    height: HEIGHT,
    backgroundColor: 0x222222
});
document.body.appendChild(app.view);

// Matterエンジン
const engine = Engine.create();
const world = engine.world;
const runner = Runner.create();
Runner.run(runner, engine);

// --- ステージ設定 ---
const stageWidth = 1600;
const stageHeight = 60;
const stageY = HEIGHT - 100;

// 崖左右位置
const ledgeLeftX = WIDTH / 2 - stageWidth / 2;
const ledgeRightX = WIDTH / 2 + stageWidth / 2;

// Pixiステージコンテナ
const stageContainer = new PIXI.Container();
app.stage.addChild(stageContainer);

// 地面
const ground = Bodies.rectangle(WIDTH / 2, stageY + stageHeight / 2, stageWidth, stageHeight, { isStatic: true });
Composite.add(world, ground);

const groundSprite = new PIXI.Graphics();
groundSprite.beginFill(0x4444ff);
groundSprite.drawRect(0, 0, stageWidth, stageHeight);
groundSprite.endFill();
groundSprite.x = 0;
groundSprite.y = stageY;
stageContainer.addChild(groundSprite);

// --- プレイヤー生成 ---
function createPlayer(x, color) {
    const body = Bodies.rectangle(x, stageY - 200, 40, 60, { friction: 0.001, restitution: 0.2 });
    const sprite = new PIXI.Graphics();
    sprite.beginFill(color);
    sprite.drawRect(-20, -30, 40, 60);
    sprite.endFill();
    stageContainer.addChild(sprite);
    return {
        body, sprite,
        attacking: false,
        canAttack: true,
        dir: 1,
        spawnX: x,
        spawnY: stageY - 200,
        hanging: false
    };
}

const player1 = createPlayer(WIDTH / 2 - 200, 0xff4444);
const player2 = createPlayer(WIDTH / 2 + 200, 0x44ff44);
Composite.add(world, [player1.body, player2.body]);

// --- 攻撃処理 ---
function attack(player, target) {
    if (!player.canAttack) return;
    player.attacking = true;
    player.canAttack = false;

    const attackRange = 60;
    const power = 0.075;
    const dir = player.dir;

    const fx = new PIXI.Graphics();
    fx.beginFill(0xffffff);
    fx.drawCircle(0, 0, 15);
    fx.endFill();
    fx.x = player.sprite.x + dir * attackRange;
    fx.y = player.sprite.y;
    stageContainer.addChild(fx);
    setTimeout(() => stageContainer.removeChild(fx), 100);

    const dx = target.body.position.x - player.body.position.x;
    const dy = target.body.position.y - player.body.position.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < attackRange) {
        Body.applyForce(target.body, target.body.position, { x: dir * power, y: -power });
        target.hanging = false; // 攻撃で崖掴まり解除
    }

    setTimeout(() => { player.attacking = false; }, 200);
    setTimeout(() => { player.canAttack = true; }, 600);
}

// --- キー入力 ---
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// --- 崖掴まり判定 ---
function checkLedgeGrab(player) {
    const x = player.body.position.x;
    const y = player.body.position.y;
    const grabZone = 10;

    if (Math.abs(x - ledgeLeftX) < grabZone && y > stageY - 80 && y < stageY + 30) {
        Body.setVelocity(player.body, { x: 0, y: 0 });
        Body.setPosition(player.body, { x: ledgeLeftX + 25, y: stageY - 50 });
        player.hanging = true;
        return;
    }
    if (Math.abs(x - ledgeRightX) < grabZone && y > stageY - 80 && y < stageY + 30) {
        Body.setVelocity(player.body, { x: 0, y: 0 });
        Body.setPosition(player.body, { x: ledgeRightX - 25, y: stageY - 50 });
        player.hanging = true;
        return;
    }
}

// --- ゲームループ ---
app.ticker.add(() => {
    [player1, player2].forEach((p, i) => {
        const keySet = i===0
            ? { left:'KeyA', right:'KeyD', jump:'KeyW', attack:'Space' }
            : { left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp', attack:'Enter' };

        if (p.hanging) {
            if (keys[keySet.jump]) {
                p.hanging = false;
                Body.applyForce(p.body, p.body.position, { x:0, y:-0.07 });
            }
            return;
        }

        if (keys[keySet.left]) { Body.applyForce(p.body, p.body.position, { x:-0.002, y:0 }); p.dir=-1; }
        if (keys[keySet.right]) { Body.applyForce(p.body, p.body.position, { x:0.002, y:0 }); p.dir=1; }
        if (keys[keySet.jump] && Math.abs(p.body.velocity.y)<0.1) Body.applyForce(p.body, p.body.position, { x:0, y:-0.07 });
        if (keys[keySet.attack]) attack(p, i===0?player2:player1);

        checkLedgeGrab(p);
        Body.setAngle(p.body,0);
        Body.setAngularVelocity(p.body,0);

        p.sprite.x = p.body.position.x;
        p.sprite.y = p.body.position.y;

        if (p.body.position.y > HEIGHT+300 || p.body.position.x < -500 || p.body.position.x > WIDTH+500) {
            Body.setPosition(p.body, {x:p.spawnX, y:p.spawnY});
            Body.setVelocity(p.body, {x:0, y:0});
            p.hanging=false;
        }
    });

    // --- カメラ制御 ---
    const midX = (player1.body.position.x + player2.body.position.x)/2;
    const midY = (player1.body.position.y + player2.body.position.y)/2;

    const distX = Math.abs(player1.body.position.x - player2.body.position.x);
    const distY = Math.abs(player1.body.position.y - player2.body.position.y);

    const zoomX = Math.max(0.8, Math.min(1.2, 800 / (distX + 200)));
    const zoomY = Math.max(0.8, Math.min(1.2, 450 / (distY + 200)));
    const targetZoom = Math.min(zoomX, zoomY);

    stageContainer.scale.x += (targetZoom - stageContainer.scale.x)*0.05;
    stageContainer.scale.y = stageContainer.scale.x;

    const screenCenterX = app.renderer.width/2;
    const screenCenterY = app.renderer.height/2;

    const targetX = screenCenterX - midX * stageContainer.scale.x;
    const targetY = screenCenterY - midY * stageContainer.scale.y;

    stageContainer.x += (targetX - stageContainer.x)*0.05;
    stageContainer.y += (targetY - stageContainer.y)*0.05;
});
</script>
</body>
</html>
