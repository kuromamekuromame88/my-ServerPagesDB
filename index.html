<canvas id="game"></canvas>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js"></script>
<script>
  // === Pixi.js 初期化 ===
  const app = new PIXI.Application({
    view: document.getElementById('game'),
    width: 800,
    height: 600,
    backgroundColor: 0x000010
  });

  // === 背景（星空） ===
  const stars = new PIXI.Graphics();
  for (let i = 0; i < 100; i++) {
    stars.beginFill(0xffffff, Math.random());
    stars.drawCircle(Math.random() * 800, Math.random() * 600, Math.random() * 2);
    stars.endFill();
  }
  app.stage.addChild(stars);

  // === 終点ステージ ===
  const stageGraphics = new PIXI.Graphics();
  stageGraphics.beginFill(0x4040ff);
  stageGraphics.drawRoundedRect(150, 500, 500, 40, 10);
  stageGraphics.endFill();
  app.stage.addChild(stageGraphics);

  // === プレイヤー ===
  const player = PIXI.Sprite.from('https://pixijs.io/examples/examples/assets/bunny.png');
  player.anchor.set(0.5);
  player.scale.set(1.5);
  app.stage.addChild(player);

  // === Matter.js 初期化 ===
  const Engine = Matter.Engine,
        World = Matter.World,
        Bodies = Matter.Bodies,
        Body = Matter.Body;

  const engine = Engine.create();
  engine.gravity.y = 1.2;

  // プレイヤー：矩形ボディ（回転禁止）
  const playerBody = Bodies.rectangle(400, 300, 40, 60, {
    restitution: 0.0,
    friction: 0.1
  });
  Body.setInertia(playerBody, Infinity); // 回転しないよう固定
  Body.setAngle(playerBody, 0);

  // ステージの床
  const ground = Bodies.rectangle(400, 520, 500, 40, { isStatic: true, friction: 1 });

  World.add(engine.world, [playerBody, ground]);

  // === キー入力 ===
  const keys = {};
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') e.preventDefault(); // ブラウザのスクロール防止
    keys[e.code] = true;
  });
  window.addEventListener('keyup', e => keys[e.code] = false);

  // === メインループ ===
  app.ticker.add(() => {
    Engine.update(engine, 1000 / 60);

    // 回転を常に止める（完全固定）
    Body.setAngularVelocity(playerBody, 0);
    Body.setAngle(playerBody, 0);

    // 移動
    const vel = playerBody.velocity;
    if (keys['ArrowLeft']) Body.setVelocity(playerBody, { x: -5, y: vel.y });
    if (keys['ArrowRight']) Body.setVelocity(playerBody, { x: 5, y: vel.y });

    // 接地判定
    const onGround = Math.abs(playerBody.position.y - 500) < 50 && Math.abs(vel.y) < 1;

    // ジャンプ（スペースキー）
    if (keys['Space'] && onGround) {
      Body.setVelocity(playerBody, { x: vel.x, y: -12 });
    }

    // 座標同期
    player.x = playerBody.position.x;
    player.y = playerBody.position.y;

    // 落下したら復帰
    if (playerBody.position.y > 800) {
      Body.setPosition(playerBody, { x: 400, y: 100 });
      Body.setVelocity(playerBody, { x: 0, y: 0 });
    }
  });
</script>
