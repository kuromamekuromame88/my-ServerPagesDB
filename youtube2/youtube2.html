<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>yt-dlp Client</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, select, button { margin: 5px; }
    video { width: 100%; max-width: 600px; margin-top: 10px; }
    .file { margin: 5px 0; }
  </style>
</head>
<body>

<h2>サーバー設定</h2>
<input id="baseUrl" value="https://ytdlserver.onrender.com" style="width:300px">

<h2>ダウンロード</h2>
<input id="url" placeholder="URL" style="width:400px">
<select id="quality">
  <option>1080p</option>
  <option selected>720p</option>
  <option>480p</option>
</select>
<select id="container">
  <option>mp4</option>
  <option>mkv</option>
</select>
<button onclick="startDownload()">ダウンロード</button>

<h2>ファイル一覧</h2>
<button onclick="loadFiles()">更新</button>
<div id="files"></div>

<h2>再生</h2>
<video id="player" controls></video>

<script>
function api(path){
  const base = document.getElementById("baseUrl").value;
  return base + path;
}

// ダウンロード開始
async function startDownload(){
  const url = document.getElementById("url").value;
  const quality = document.getElementById("quality").value;
  const container = document.getElementById("container").value;

  const res = await fetch(api("/download"), {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({url, quality, container})
  });

  const data = await res.json();
  alert(JSON.stringify(data));
}

// ファイル一覧取得
async function loadFiles(){
  const res = await fetch(api("/files"));
  const files = await res.json();

  const div = document.getElementById("files");
  div.innerHTML = "";

  files.forEach(f => {
    const el = document.createElement("div");
    el.className = "file";

    el.innerHTML = `
      ${f.name}
      <button onclick="play('${f.id}')">再生</button>
      <button onclick="downloadFile('${f.id}')">DL</button>
    `;

    div.appendChild(el);
  });
}

// 再生
function play(id){
  const player = document.getElementById("player");
  player.src = api("/video/" + id);
  player.play();
}

// ダウンロード
function downloadFile(id){
  window.open(api("/download/" + id));
}
</script>

</body>
</html>
