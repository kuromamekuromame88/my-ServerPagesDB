<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
}

.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: #222;
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 1000;
}

.top-bar a{
  font-size: 1.2em;
  font-weight: bold;
  text-decoration: none;
  padding: 10px;
  border-radius: 12px;
  background:#222;
  color: white;
}

.top-bar a:hover{
  background:#444;
}

.nav-ui{
  position: absolute;
  top: 20px;
  right: 40px;
}

.nav-ui input{
  border: none;
  border-radius: 6px;
  padding: 10px;
  background-color: #444;
  color: #fff;
  font-size: 1.5em;
  font-weight: bold;
}

main {
  margin-top: 60px;
  height: calc(100vh - 60px);
  display: flex;
}

.content, .editor {
  width: 50vw;
  height: 100%;
}

.content {
  background: #f0f0f0;
  padding: 20px;
  box-sizing: border-box;
}

.maincontent {
  position: relative;
  height: calc(100% - 60px);
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
}

iframe, .EditFrame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  transition: opacity .2s;
}

.EditFrame {
  background: rgba(0,0,0,0.05);
  pointer-events: none;
  opacity: 0;
}

.editor {
  background: #e0e0e0;
  display: flex;
  flex-direction: column;
  padding: 20px;
  box-sizing: border-box;
}

.CodeMirror {
  flex: 1;
  border-radius: 12px;
  font-size: 14px;
}
</style>

<script>
//main.jsの中身

</script>
</head>

<body>
<header class="top-bar">
  <a href="/">tool-webs</a>
  <div class="nav-ui">
    <input type="text" id="PageTitle" class="PageTitle" placeholder="ページのタイトルを入力">
  </div>
</header>

<main>
  <div class="content">
    <div class="maincontent">
      <iframe id="previewFrame"></iframe>
      <div class="EditFrame" id="EditFrame"></div>
    </div>
    <button id="UIEditBtn">UI編集</button>
    <button id="TrueViewBtn">プレビュー</button>
  </div>

  <div class="editor">
    <textarea id="mirror"><h1>Hello World</h1></textarea>
  </div>
</main>
