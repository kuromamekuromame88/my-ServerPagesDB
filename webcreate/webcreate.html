<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webページエディター</title>

    <style>
        /* ----------------- top-bar ----------------- */

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background-color: #222;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.3);
  z-index: 1000;
}

.top-bar .logo {
  font-size: 1.2em;
  font-weight: bold;
  text-decoration: none;
  color: white;
}

main {
  display: flex;
  margin-top: 60px; /* top-barの高さ分のマージンを追加 */
  height: calc(100vh - 60px); /* top-barの高さを引いた高さに設定 */
}

/* エディター関連 */
.content {
    flex: 1;
    background-color: #f0f0f0;
    width: 50vw;
    overflow-y: auto;
}

.editor {
    flex: 1;
    width: 50vw;
    background-color: #e0e0e0;
    border-left: 1px solid #ccc;
    display: flex;
    flex-direction: column;
}

/* -- UI系 -- */
.switchViewMode{
    position: relative;
    top: 20px;
    right: 20px;
    display: flex;
    background-color: #ddd;
    flex-direction: row;
    gap: 10px;
    border-radius: 10%;
}

.switchViewMode button{
    width: 30px;
    height: 30px;
    background-color: #222;
    color: #fff;
    border: none;
    border-radius: 20%;
    font-size: 15px;
    text-align: center;
    justify-content: center;
    cursor: pointer;
}

    </style>
  </head>
  <body>
    <header class="top-bar">
      <a href="/" class="logo">tool-webs</a>
    </header>

    <main>
      <div class="content">
        <div class="switchViewMode">
            <button id="UIEditBtn">✏</button>
            <button id="TrueViewBtn">📋️</button>
        </div>
      </div>
      <div class="editor">
        <div class="toolbar">
        </div>
      </div>
    </main>
  </body>
</html>
