<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webページエディター</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
}

.top-bar {
  position: fixed;
  inset: 0 0 auto 0;
  height: 60px;
  background: #222;
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 1000;
}

.top-bar a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

main {
  margin-top: 60px;
  height: calc(100vh - 60px);
  display: flex;
}

.content, .editor {
  width: 50vw;
  height: 100%;
}

.content {
  padding: 20px;
  background: #f0f0f0;
}

.maincontent {
  position: relative;
  height: calc(100% - 60px);
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  transition: opacity .2s;
}

.editor {
  padding: 20px;
  background: #e0e0e0;
  display: flex;
  flex-direction: column;
}

.CodeMirror {
  flex: 1;
  border-radius: 12px;
}

.tool-box {
  height: 60px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: #fff;
  cursor: pointer;
}
</style>

<script>
let editor;
let editMode = false;

window.addEventListener("load", () => {
  const previewFrame = document.getElementById("previewFrame");
  const editFrame = document.getElementById("EditFrame");

  editor = CodeMirror.fromTextArea(mirror, {
    mode: "htmlmixed",
    lineNumbers: true,
    autoCloseTags: true,
    autoCloseBrackets: true
  });

  function render() {
    previewFrame.srcdoc = editor.getValue();
    editFrame.srcdoc = editor.getValue();
  }

  function showPreview() {
    previewFrame.style.opacity = 1;
    previewFrame.style.pointerEvents = "auto";
    editFrame.style.opacity = 0;
    editFrame.style.pointerEvents = "none";
    editMode = false;
  }

  function showEdit() {
    previewFrame.style.opacity = 0;
    previewFrame.style.pointerEvents = "none";
    editFrame.style.opacity = 1;
    editFrame.style.pointerEvents = "auto";
    editMode = true;
  }

  editor.on("change", render);
  render();
  showPreview();

  UIEditBtn.onclick = showEdit;
  TrueViewBtn.onclick = showPreview;
});
</script>
</head>

<body>
<header class="top-bar">
  <a href="/">tool-webs</a>
</header>

<main>
  <div class="content">
    <div class="maincontent">
      <iframe id="previewFrame"></iframe>
      <iframe id="EditFrame"></iframe>
    </div>
    <div class="tool-box">
      <button id="UIEditBtn">UI編集</button>
      <button id="TrueViewBtn">プレビュー</button>
    </div>
  </div>

  <div class="editor">
<textarea id="mirror">
<!DOCTYPE html>
<html lang="ja">
<body>
  <h1>Hello, World!</h1>
</body>
</html>
</textarea>
  </div>
</main>
</body>
</html>
