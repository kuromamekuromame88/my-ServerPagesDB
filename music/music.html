<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Spotify Track Explorer (CSE)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google CSE -->
  <script async src="https://cse.google.com/cse.js?cx=566968ae60bc84f90"></script>

  <style>
        body {
      background-color: #f4f6f8;
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* CSE 全体の枠 */
    .gcse-searchresults,
    .gcse-search {
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
    }

    /* 検索ボックス */
    input.gsc-input {
      background: #ffffff !important;
      color: #111 !important;
      font-size: 16px !important;
    }

    /* 検索結果タイトル */
    .gsc-webResult .gsc-result .gs-title {
      color: #0b5cff !important;
      font-size: 17px;
      font-weight: 600;
    }

    /* 検索結果リンク（ホバー時） */
    .gsc-webResult .gsc-result .gs-title:hover {
      text-decoration: underline;
    }

    /* スニペット（説明文） */
    .gsc-webResult .gsc-result .gs-snippet {
      color: #222 !important;
      font-size: 14px;
      line-height: 1.6;
    }

    /* URL表示 */
    .gsc-webResult .gsc-result .gs-visibleUrl {
      color: #0a7c3a !important;
      font-size: 13px;
    }

    /* 区切り線 */
    .gsc-result {
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    /* 広告ラベルを目立たなく */
    .gsc-adBlock {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<header>
  🎧 Spotify Track Explorer（Google CSE）
</header>

<div class="container">
  <!-- 検索ボックス -->
  <div class="gcse-search"></div>
</div>

<div class="player">
  <iframe
    id="player"
    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture">
  </iframe>
</div>

<script>
  /*
    Google CSE の検索結果リンクをクリックしたら、
    Spotify track URL を捕捉して iframe 再生する
  */

  document.addEventListener("click", e => {
    const a = e.target.closest("a");
    if (!a) return;

    const href = a.href;
    if (!href) return;

    const trackId = extractTrackId(href);
    if (!trackId) return;

    e.preventDefault(); // ページ遷移を止める
    play(trackId);
  });

  function extractTrackId(url) {
    // https://open.spotify.com/track/{ID}?si=...
    const match = url.match(/open\.spotify\.com\/track\/([a-zA-Z0-9]+)/);
    return match ? match[1] : null;
  }

  function play(trackId) {
    const iframe = document.getElementById("player");
    iframe.src = `https://open.spotify.com/embed/track/${trackId}`;
  }
</script>

</body>
</html>
